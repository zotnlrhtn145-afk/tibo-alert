<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="티보 알림">
<title>티보 알림</title>
<meta name="description" content="OpenAI 코덱스 책임자 티보(@thsottiaux)의 리셋·리셋권·업그레이드 공지를 한눈에 보는 달력. didreset.com 공개 데이터를 브라우저가 직접 받아 옵니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 시안 B · 다크 글로우. 한 열, 폰 폭 기준. 위에서부터 상단바 → 다음 리셋 추정 → 종류 스트립 → 달력(+선택한 날) → 티보 최근 글 → 하단 탭. */
:root {
  --bg: #0b0b0f; --card: #16161d; --card-2: #1d1d26; --ink: #f5f5f7; --muted: #8a8a94; --line: #26262f;
  --c-reset: #a98cf0; --c-banked: #ffa15c; --c-tease: #7fb0f0; --c-boost: #5fd39a; --c-etc: #c2c2cc; --danger: #ff6b6b;
  --g1: #f9ce34; --g2: #ee2a7b; --g3: #6228d7;
  --grad: linear-gradient(135deg, var(--g1), var(--g2) 50%, var(--g3));
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 22px; --r-s: 14px; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--g2); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.main { display: grid; gap: 14px; padding: 4px 16px 16px; }
.main > * { min-width: 0; }
.app > * { min-width: 0; width: 100%; }
body { overflow-x: hidden; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: linear-gradient(var(--bg) 70%, rgba(11,11,15,0)); padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 14px; display: flex; align-items: center; justify-content: space-between; }
.brand { font-size: 24px; font-weight: 900; letter-spacing: -0.03em; background: var(--grad); background-size: 200% 200%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 8s ease-in-out infinite; }
.top .acts { display: flex; gap: 6px; }
.ibtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; color: var(--ink); transition: background .2s, transform .15s; }
.ibtn:hover { background: var(--card); } .ibtn:active { transform: scale(.92); }
.ibtn.on { color: var(--g2); }
.loading .ibtn.refresh svg { animation: spin 1s linear infinite; }

/* cards */
.card { background: var(--card); border-radius: var(--r); animation: rise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 70ms); }
.hero { position: relative; padding: 20px; border-radius: var(--r); background: var(--card); isolation: isolate; }
.hero::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: var(--grad); background-size: 200% 200%; animation: flow 8s ease-in-out infinite; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.hero .k { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.live { display: inline-flex; align-items: center; gap: 8px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--c-boost); box-shadow: 0 0 0 0 rgba(95,211,154,.7); animation: pulse 2s ease-out infinite; }
.hero .big { font-size: 40px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; margin: 6px 0 4px; background: var(--grad); background-size: 200% 200%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 8s ease-in-out infinite; min-height: 1.1em; }
.hero .sub { font-size: 12.5px; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 10px; border-radius: 14px; font-size: 12px; font-weight: 700; }
.pill svg { font-size: 14px; stroke-width: 2.4; }
.pill.reset { background: rgba(169,140,240,.16); color: var(--c-reset); } .pill.banked { background: rgba(255,161,92,.16); color: var(--c-banked); }
.pill.tease { background: rgba(127,176,240,.16); color: var(--c-tease); } .pill.boost { background: rgba(95,211,154,.16); color: var(--c-boost); }
.num { font-variant-numeric: tabular-nums; }

/* type strip */
.types { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 2px; scrollbar-width: none; }
.types::-webkit-scrollbar { display: none; }
.type { flex: none; display: grid; justify-items: center; gap: 6px; width: 76px; opacity: 1; transition: opacity .2s, transform .2s; }
.type .ring { width: 62px; height: 62px; border-radius: 50%; padding: 2.5px; background: var(--line); transition: background .25s, transform .25s; }
.type .ring > span { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: var(--card); font-size: 24px; position: relative; }
.type .ring > span svg { stroke-width: 2.2; }
.type .cnt { position: absolute; right: -2px; bottom: -2px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; color: #fff; }
.type .lb { font-size: 11px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.type.active .ring { background: var(--grad); transform: scale(1.04); }
.filtered .type:not(.active) { opacity: .4; }
.type.reset span { color: var(--c-reset); } .type.banked span { color: var(--c-banked); } .type.tease span { color: var(--c-tease); } .type.boost span { color: var(--c-boost); } .type.etc span { color: var(--c-etc); }
.type.reset .cnt { background: var(--c-reset); } .type.banked .cnt { background: var(--c-banked); } .type.tease .cnt { background: var(--c-tease); } .type.boost .cnt { background: var(--c-boost); } .type.etc .cnt { background: #55555f; }

/* calendar */
.cal { padding: 14px 14px 12px; }
.cal .h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal .h h2 { margin: 0; font-size: 16px; font-weight: 700; }
.cal .h .mnav { display: flex; gap: 2px; }
.cal .h .mnav button { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 20px; }
.cal .h .mnav button:hover { background: var(--card-2); color: var(--ink); }
.cal .h .mnav .today { width: auto; padding: 0 10px; font-size: 12px; font-weight: 700; }
.wd, .days { display: grid; grid-template-columns: repeat(7, 1fr); }
.wd div { text-align: center; font-size: 11px; font-weight: 500; color: var(--muted); padding: 4px 0 6px; }
.wd div:first-child { color: var(--danger); } .wd div:last-child { color: var(--c-tease); }
.days { gap: 4px 0; }
.day { height: 54px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 14px; font-weight: 500; color: var(--ink); position: relative; transition: background .15s, transform .15s; }
.day:hover { background: var(--card-2); } .day:active { transform: scale(.94); }
.day.other { color: #3a3a44; } .day.other .chips { visibility: hidden; }
.day.today { background: var(--grad); color: #fff; font-weight: 700; box-shadow: 0 0 18px rgba(238,42,123,.35); animation: glow 2.6s ease-in-out infinite; }
.day.sel:not(.today)::after { content: ""; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--g2); }
.chips { display: flex; gap: 2px; height: 16px; }
.chip { width: 16px; height: 16px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; }
.chip svg { stroke-width: 2.8; }
.chip.reset { background: rgba(169,140,240,.2); color: var(--c-reset); } .chip.banked { background: rgba(255,161,92,.2); color: var(--c-banked); }
.chip.tease { background: rgba(127,176,240,.2); color: var(--c-tease); } .chip.boost { background: rgba(95,211,154,.2); color: var(--c-boost); } .chip.etc { background: rgba(194,194,204,.2); color: var(--c-etc); }
.chip.more { font-size: 9px; font-weight: 700; color: var(--muted); background: var(--card-2); }
.day.today .chip { background: rgba(255,255,255,.28); color: #fff; }
.filtered .chip.dim { opacity: .18; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 3px 8px 3px 4px; border-radius: 12px; }
.legend .reset { background: rgba(169,140,240,.12); color: var(--c-reset); } .legend .banked { background: rgba(255,161,92,.12); color: var(--c-banked); }
.legend .tease { background: rgba(127,176,240,.12); color: var(--c-tease); } .legend .boost { background: rgba(95,211,154,.12); color: var(--c-boost); } .legend .etc { background: rgba(194,194,204,.12); color: var(--c-etc); }

/* day panel */
.panel { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
.panel .ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.panel .ph h3 { margin: 0; font-size: 15px; font-weight: 700; }
.sbtn { font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: var(--card-2); color: var(--ink); display: inline-flex; align-items: center; gap: 5px; transition: background .2s, transform .15s; }
.sbtn:hover { background: #262632; } .sbtn:active { transform: scale(.95); }
.sbtn.pri { background: var(--grad); color: #fff; }
.sbtn.dan { color: var(--danger); }
.empty { color: var(--muted); font-size: 13px; margin: 0; padding: 4px 0; }
.list { display: grid; gap: 8px; }
.item { display: flex; gap: 12px; padding: 10px 12px; border-radius: var(--r-s); background: var(--card-2); align-items: flex-start; animation: rise .35s ease both; }
.item.new { animation: flash 1.6s ease both; }
.ib { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; flex: none; }
.ib svg { stroke-width: 2.2; }
.ib.reset { background: rgba(169,140,240,.18); color: var(--c-reset); } .ib.banked { background: rgba(255,161,92,.18); color: var(--c-banked); }
.ib.tease { background: rgba(127,176,240,.18); color: var(--c-tease); } .ib.boost { background: rgba(95,211,154,.18); color: var(--c-boost); } .ib.etc { background: rgba(194,194,204,.18); color: var(--c-etc); }
.item .b { min-width: 0; flex: 1; display: grid; gap: 3px; }
.item .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.item .t b { font-size: 13px; font-weight: 700; }
.item .t b.reset { color: var(--c-reset); } .item .t b.banked { color: var(--c-banked); } .item .t b.tease { color: var(--c-tease); } .item .t b.boost { color: var(--c-boost); } .item .t b.etc { color: var(--c-etc); }
.item .t small { font-size: 12px; color: var(--muted); }
.item .m { font-size: 13px; overflow-wrap: anywhere; white-space: pre-wrap; margin: 0; }
.item .en { font-size: 11.5px; color: var(--muted); margin: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .en:hover { -webkit-line-clamp: unset; }
.item .a { display: flex; gap: 12px; align-items: center; font-size: 11px; color: var(--muted); margin-top: 2px; }
.item .a a { color: var(--muted); text-decoration: none; display: inline-flex; gap: 4px; align-items: center; } .item .a a:hover { color: var(--ink); }
.item .a button { font-size: 11px; color: var(--muted); } .item .a button:hover { color: var(--ink); } .item .a button.dan { color: var(--danger); }

/* form */
.form { display: grid; gap: 10px; margin-top: 10px; padding: 12px; border-radius: var(--r-s); background: var(--card-2); animation: rise .3s ease both; }
.form h4 { margin: 0; font-size: 14px; }
.form label { display: grid; gap: 4px; font-size: 11.5px; color: var(--muted); }
.form input, .form select, .form textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
.form textarea { min-height: 80px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form .acts { display: flex; justify-content: flex-end; gap: 8px; }
.toast { font-size: 12.5px; color: var(--c-boost); min-height: 1.2em; padding: 6px 2px 0; }

/* feed */
.feed-h { display: flex; justify-content: space-between; align-items: center; padding: 2px 2px 0; }
.feed-h h2 { margin: 0; font-size: 15px; font-weight: 700; }
.feed-h a { font-size: 12px; color: var(--muted); text-decoration: none; display: inline-flex; gap: 4px; align-items: center; } .feed-h a:hover { color: var(--ink); }
.feed { display: grid; gap: 8px; }
.feed .item { background: var(--card); }
.foot { font-size: 11.5px; color: var(--muted); padding: 4px 2px 8px; line-height: 1.55; }
.foot a { color: var(--c-tease); text-decoration: none; }
.status { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; padding: 0 2px; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: #55555f; } .status.ok i { background: var(--c-boost); } .status.err i { background: var(--danger); }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; background: rgba(16,16,22,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .in { width: 100%; max-width: 520px; display: flex; justify-content: space-between; padding: 10px 28px 12px; }
.nav button, .nav a { width: 44px; height: 44px; display: grid; place-items: center; font-size: 26px; color: var(--muted); border-radius: 14px; text-decoration: none; transition: color .2s, transform .15s; position: relative; }
.nav button:active, .nav a:active { transform: scale(.9); }
.nav .on { color: var(--ink); }
.nav .on::after { content: ""; position: absolute; bottom: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--grad); }
.nav .plus { background: var(--grad); color: #fff; width: 48px; height: 40px; font-size: 24px; align-self: center; box-shadow: 0 6px 18px rgba(238,42,123,.3); }

.banner { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r-s); background: var(--card-2); font-size: 12.5px; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes flow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(95,211,154,.7); } 70% { box-shadow: 0 0 0 9px rgba(95,211,154,0); } 100% { box-shadow: 0 0 0 0 rgba(95,211,154,0); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 14px rgba(238,42,123,.3); } 50% { box-shadow: 0 0 26px rgba(238,42,123,.6); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(249,206,52,.0); background: rgba(238,42,123,.25); } 30% { box-shadow: 0 0 0 3px rgba(238,42,123,.4); } 100% { background: var(--card); box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (min-width: 720px) { .main { padding-top: 10px; } .day { height: 60px; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">티보 알림</div>
    <div class="acts">
      <button class="ibtn refresh" id="refresh" type="button" aria-label="지금 확인" title="지금 확인"></button>
      <button class="ibtn" id="notif" type="button" aria-label="새 공지 알림" title="새 공지 알림"></button>
    </div>
  </header>

  <main class="main">
    <section class="hero card" style="--i:0">
      <div class="k"><span class="live"><i></i>다음 전체 리셋 추정</span><span>비공식</span></div>
      <div class="big" id="st-next">—</div>
      <div class="sub" id="st-next-s">불러오는 중…</div>
      <div class="pills" id="pills"></div>
    </section>

    <div class="types card" id="types" style="--i:1; background: none"></div>

    <section class="cal card" style="--i:2">
      <div class="h">
        <h2 id="month-label">—</h2>
        <div class="mnav"><button type="button" id="prev" aria-label="이전 달"></button><button type="button" id="today-btn" class="today">오늘</button><button type="button" id="next" aria-label="다음 달"></button></div>
      </div>
      <div class="wd"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div class="days" id="days"></div>
      <div class="legend" id="legend"></div>
      <div class="panel">
        <div class="ph"><h3 id="detail-date">—</h3><button type="button" class="sbtn" id="add-btn"></button></div>
        <div id="detail"></div>
        <div class="toast" id="toast" aria-live="polite"></div>
        <form class="form" id="form" autocomplete="off" hidden>
          <h4 id="form-title">내 기록 추가</h4>
          <input type="hidden" id="f-id">
          <div class="two"><label>날짜 <input type="date" id="f-date" required></label><label>시간 (선택) <input type="time" id="f-time"></label></div>
          <div class="two">
            <label>종류 <select id="f-cat"><option value="etc">내 기록</option><option value="reset">전체 리셋</option><option value="banked">리셋권</option><option value="boost">업그레이드</option><option value="tease">리셋 예고</option></select></label>
            <label>반복 <select id="f-repeat"><option value="none">없음</option><option value="daily">매일</option><option value="weekly">매주 (같은 요일)</option><option value="monthly">매월 (같은 날)</option></select></label>
          </div>
          <label>제목 <input type="text" id="f-title" placeholder="예: 리셋권 써야 함" required maxlength="60"></label>
          <label>메모 <textarea id="f-memo" placeholder="적어 둘 내용"></textarea></label>
          <div class="acts"><button type="button" class="sbtn" id="f-cancel">취소</button><button type="submit" class="sbtn pri" id="f-submit">추가</button></div>
        </form>
      </div>
    </section>

    <div class="banner card" id="notif-banner" style="--i:3" hidden>
      <span>페이지가 열려 있을 때 새 리셋 공지가 올라오면 브라우저 알림으로 알려 드릴까요?</span>
      <span style="display:flex;gap:6px"><button class="sbtn pri" id="notif-on" type="button">알림 켜기</button><button class="sbtn" id="notif-skip" type="button">괜찮아요</button></span>
    </div>

    <section id="feed-sec" style="display:grid;gap:10px">
      <div class="feed-h card" style="--i:4; background:none"><h2>티보의 최근 글</h2><a href="https://x.com/thsottiaux" target="_blank" rel="noopener noreferrer">@thsottiaux <svg class="i"><use href="#i-ext"/></svg></a></div>
      <div class="feed" id="feed"></div>
    </section>

    <div class="status" id="status"><i></i><span id="status-text">didreset.com에 연결 중…</span></div>
    <p class="foot">X 페이지는 이 안에 직접 띄울 수 없어, 티보(@thsottiaux)의 공지 글을 정리한 <a href="https://didreset.com/codex" target="_blank" rel="noopener noreferrer">didreset.com</a>의 공개 데이터를 브라우저가 직접 받아 옵니다. 열려 있는 동안 5분마다 새 글을 확인합니다. 내 기록은 이 브라우저에만 저장됩니다.</p>
  </main>
</div>

<script src="ko.js"></script>
<script>
(function () {
  const API_TIMELINE = 'https://didreset.com/api/timeline?provider=codex&limit=200';
  const API_STATUS = 'https://didreset.com/api/status';
  const REFRESH_MS = 5 * 60 * 1000;
  const CATS = { reset: '전체 리셋', banked: '리셋권', tease: '리셋 예고', boost: '업그레이드', promo: '프로모션', etc: '내 기록' };
  const TITLE = { reset: '전체 리셋', banked: '리셋권(뱅크) 지급', tease: '리셋 예고', boost: '업그레이드/한도 상향', promo: '프로모션' };
  const ICON = { reset: 'zap', banked: 'ticket', tease: 'clock', boost: 'trend', promo: 'trend', etc: 'user' };
  const REPEATS = { none: '', daily: '매일', weekly: '매주', monthly: '매월' };
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ico = (n, cls) => `<svg class="i${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const catOf = e => CATS[e.cat] ? e.cat : 'etc';
  const safeUrl = u => (typeof u === 'string' && /^https:\/\/(x\.com|twitter\.com)\//.test(u)) ? u : '';
  const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);

  // static icons
  $('refresh').innerHTML = ico('refresh'); $('prev').innerHTML = ico('chevl'); $('next').innerHTML = ico('chevr');
  $('nav-home').innerHTML = ico('home'); $('nav-cal').innerHTML = ico('cal'); $('nav-add').innerHTML = ico('plus'); $('nav-feed').innerHTML = ico('list');
  document.querySelector('.nav a').innerHTML = ico('ext'); $('add-btn').innerHTML = ico('plus') + ' 내 기록';
  $('legend').innerHTML = ['reset', 'banked', 'tease', 'boost', 'etc'].map(k => `<span class="${k}"><span class="chip ${k}">${ico(ICON[k])}</span>${CATS[k]}</span>`).join('');

  const todayStr = ymd(new Date());
  let view = { y: new Date().getFullYear(), m: new Date().getMonth() };
  let selected = todayStr;
  let auto = [], notes = ls.get('tibo-notes-v1', []), statusInfo = null, filter = null;
  let loaded = false, confirmDel = null, timer = null, newIds = new Set();

  function setStatus(kind, text) { $('status').className = 'status ' + kind; $('status-text').textContent = text; }

  // ----- data -----
  function toEvent(e) {
    const t = new Date(e.announcedAt); if (isNaN(t)) return null;
    const en = String(e.summary || '');
    const ko = (window.TIBO_KO && window.TIBO_KO[String(e.id)]) || (window.TIBO_KOIFY ? window.TIBO_KOIFY(en) : null);
    return { id: 'x' + e.id, date: ymd(t), time: hm(t), cat: TITLE[e.kind] ? e.kind : 'etc', title: TITLE[e.kind] || String(e.kind || '공지'), memo: ko || en, en: ko ? en : '', url: safeUrl(e.sourceUrl), source: 'didreset', ts: t.getTime() };
  }
  async function load(manual) {
    document.body.classList.add('loading');
    setStatus('', manual ? '확인 중…' : (loaded ? '새 글 확인 중…' : 'didreset.com에 연결 중…'));
    try {
      const [tl, st] = await Promise.all([
        fetch(API_TIMELINE, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('timeline ' + r.status); return r.json(); }),
        fetch(API_STATUS, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
      ]);
      const events = (Array.isArray(tl.events) ? tl.events : []).filter(e => /^\d+$/.test(String(e.id))).map(toEvent).filter(Boolean);
      const known = new Set(auto.map(e => e.id));
      const fresh = loaded ? events.filter(e => !known.has(e.id)) : [];
      newIds = new Set(fresh.map(e => e.id));
      auto = events;
      statusInfo = st && Array.isArray(st.providers) ? st.providers.find(p => p.provider === 'codex') : null;
      const first = !loaded; loaded = true;
      setStatus('ok', `didreset.com 연결됨 · 마지막 확인 ${hm(new Date())}`);
      render(first);
      if (fresh.length) { notifyNew(fresh); toast(`새 공지 ${fresh.length}건이 올라왔습니다.`); }
      ls.set('tibo-cache-v1', { at: Date.now(), events });
    } catch (err) {
      const cached = ls.get('tibo-cache-v1', null);
      if (!loaded && cached && Array.isArray(cached.events)) { auto = cached.events; loaded = true; render(true); }
      setStatus('err', `didreset.com에 연결하지 못했습니다 (${err && err.message ? err.message : '네트워크'})${cached ? ' · 저장된 기록 표시 중' : ''}`);
      if (!loaded) { renderDetail(); renderFeed(); }
    } finally { document.body.classList.remove('loading'); }
  }
  function schedule() { clearInterval(timer); timer = setInterval(() => load(false), REFRESH_MS); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(false); });
  $('refresh').addEventListener('click', () => load(true));

  // ----- notifications -----
  const perm = () => ('Notification' in window) ? Notification.permission : 'unsupported';
  function renderNotif() { const on = perm() === 'granted'; $('notif').innerHTML = ico(on ? 'bell-on' : 'bell'); $('notif').classList.toggle('on', on); $('notif-banner').hidden = !(perm() === 'default' && !ls.get('tibo-notif-skip', false)); }
  async function askNotif() { if (perm() === 'unsupported') { toast('이 브라우저는 알림을 지원하지 않습니다.'); return; } if (perm() === 'denied') { toast('브라우저 설정에서 이 사이트의 알림이 차단되어 있습니다.'); return; } try { await Notification.requestPermission(); } catch {} renderNotif(); toast(perm() === 'granted' ? '알림을 켰습니다. 페이지가 열려 있을 때 새 공지를 알려 드립니다.' : '알림이 허용되지 않았습니다.'); }
  $('notif').addEventListener('click', () => perm() === 'granted' ? toast('알림이 켜져 있습니다. 끄려면 브라우저 사이트 설정에서 바꾸세요.') : askNotif());
  $('notif-on').addEventListener('click', askNotif);
  $('notif-skip').addEventListener('click', () => { ls.set('tibo-notif-skip', true); renderNotif(); });
  function notifyNew(list) { if (perm() !== 'granted') return; for (const e of list.slice(0, 3)) { try { const n = new Notification(`티보: ${e.title}`, { body: `${e.date} ${e.time} · ${e.memo.slice(0, 120)}`, tag: e.id }); if (e.url) n.onclick = () => window.open(e.url, '_blank'); } catch {} } }

  // ----- occurrences -----
  const all = () => auto.concat(notes);
  function occursOn(ev, ds) { if (!ev.date) return false; if (ev.date === ds) return true; if (!ev.repeat || ev.repeat === 'none' || ds < ev.date) return false; const a = parse(ev.date), b = parse(ds); return ev.repeat === 'daily' || (ev.repeat === 'weekly' && a.getDay() === b.getDay()) || (ev.repeat === 'monthly' && a.getDate() === b.getDate()); }
  const byTime = (x, y) => (x.time || '99') < (y.time || '99') ? -1 : (x.time || '99') > (y.time || '99') ? 1 : 0;
  const eventsOn = ds => all().filter(e => occursOn(e, ds)).sort(byTime);
  const isAuto = e => e.source === 'didreset';
  const passes = e => !filter || catOf(e) === filter;

  // ----- hero / stats -----
  function countUp(el, to, suffix) { if (reduced) { el.textContent = to + suffix; return; } const start = performance.now(), dur = 900; const step = now => { const p = Math.min(1, (now - start) / dur); const v = Math.round(to * (1 - Math.pow(1 - p, 3))); el.textContent = v + suffix; if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
  function renderHero(first) {
    const resets = auto.filter(e => e.cat === 'reset').sort((a, b) => b.ts - a.ts);
    const banked = auto.filter(e => e.cat === 'banked').sort((a, b) => b.ts - a.ts);
    const days = [...new Set(resets.map(e => e.date))].slice(0, 11);
    let nextTxt = '—', sub = '기록이 더 쌓이면 표시';
    if (days.length >= 3) {
      const gaps = []; for (let i = 0; i < days.length - 1; i++) gaps.push((parse(days[i]) - parse(days[i + 1])) / 86400000);
      gaps.sort((a, b) => a - b); const med = gaps.length % 2 ? gaps[(gaps.length - 1) / 2] : (gaps[gaps.length / 2 - 1] + gaps[gaps.length / 2]) / 2;
      const last = parse(days[0]); const next = new Date(last.getFullYear(), last.getMonth(), last.getDate() + Math.round(med));
      const rel = Math.round((next - parse(todayStr)) / 86400000);
      nextTxt = rel < 0 ? '임박 · 언제든' : `${next.getMonth() + 1}월 ${next.getDate()}일 (${WD[next.getDay()]})`;
      const r0 = resets[0]; const lastTxt = r0 ? `${parse(r0.date).getMonth() + 1}/${parse(r0.date).getDate()} ${r0.time}` : '—';
      sub = rel < 0
        ? `예상 시점 ${next.getMonth() + 1}/${next.getDate()}에서 ${Math.abs(rel)}일 지남 · 최근 간격 중앙값 ${med}일 · 마지막 리셋 ${lastTxt}`
        : `최근 10회 리셋 간격 중앙값 ${med}일 · ${rel === 0 ? '오늘' : rel + '일 뒤'} · 마지막 리셋 ${lastTxt}`;
    }
    $('st-next').textContent = nextTxt; $('st-next-s').textContent = sub;
    const b0 = banked[0];
    $('pills').innerHTML = `
      <span class="pill banked">${ico('ticket')}마지막 리셋권 ${b0 ? esc(`${parse(b0.date).getMonth() + 1}/${parse(b0.date).getDate()}`) : '—'}</span>
      <span class="pill reset">${ico('zap')}<span class="num" id="cnt-reset">0</span>회 리셋</span>
      ${statusInfo && statusInfo.status ? `<span class="pill ${statusInfo.status === 'banked' ? 'banked' : statusInfo.status === 'reset_now' ? 'boost' : 'tease'}">${ico(statusInfo.status === 'banked' ? 'ticket' : statusInfo.status === 'reset_now' ? 'zap' : 'clock')}${esc({ reset_now: '지금 리셋 중', banked: '리셋권 상태', tease: '예고 있음', waiting: '대기 중', overdue: '예상보다 늦음', no_data: '데이터 없음' }[statusInfo.status] || statusInfo.status)}</span>` : ''}`;
    if (first) countUp($('cnt-reset'), resets.length, ''); else $('cnt-reset').textContent = resets.length;
  }

  // ----- types strip -----
  function renderTypes() {
    const counts = {}; for (const e of all()) counts[catOf(e)] = (counts[catOf(e)] || 0) + 1;
    $('types').innerHTML = ['reset', 'banked', 'tease', 'boost', 'etc'].map(k => `
      <button type="button" class="type ${k}${filter === k ? ' active' : ''}" data-filter="${k}" aria-pressed="${filter === k}">
        <span class="ring"><span>${ico(ICON[k])}<b class="cnt">${counts[k] || 0}</b></span></span>
        <span class="lb">${CATS[k]}</span></button>`).join('');
    document.body.classList.toggle('filtered', !!filter);
  }
  $('types').addEventListener('click', e => { const b = e.target.closest('[data-filter]'); if (!b) return; filter = filter === b.dataset.filter ? null : b.dataset.filter; render(false); toast(filter ? `${CATS[filter]}만 표시합니다. 다시 누르면 해제됩니다.` : ''); });

  // ----- calendar -----
  function renderCalendar() {
    $('month-label').textContent = `${view.y}년 ${view.m + 1}월`;
    const first = new Date(view.y, view.m, 1); const start = new Date(view.y, view.m, 1 - first.getDay());
    let html = '';
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i); const ds = ymd(d);
      const other = d.getMonth() !== view.m; const evs = eventsOn(ds);
      const kinds = [...new Set(evs.map(catOf))];
      const cls = ['day', other ? 'other' : '', ds === todayStr ? 'today' : '', ds === selected ? 'sel' : ''].filter(Boolean).join(' ');
      let chips = kinds.slice(0, 2).map(k => `<span class="chip ${k}${filter && filter !== k ? ' dim' : ''}" title="${CATS[k]}">${ico(ICON[k])}</span>`).join('');
      if (kinds.length > 2) chips += `<span class="chip more">+${kinds.length - 2}</span>`;
      html += `<button type="button" class="${cls}" data-date="${ds}" aria-label="${d.getMonth() + 1}월 ${d.getDate()}일${evs.length ? ', ' + kinds.map(k => CATS[k]).join(', ') : ''}"><span>${d.getDate()}</span><span class="chips">${chips}</span></button>`;
    }
    $('days').innerHTML = html;
  }
  function renderDetail() {
    const d = parse(selected);
    $('detail-date').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})${selected === todayStr ? ' · 오늘' : ''}`;
    const el = $('detail'); const evs = eventsOn(selected).filter(passes);
    if (!loaded && !evs.length) { el.innerHTML = '<p class="empty">불러오는 중…</p>'; return; }
    if (!evs.length) { el.innerHTML = `<p class="empty">${filter ? CATS[filter] + ' 기록이 없는 날입니다.' : '이 날은 티보 공지도, 내 기록도 없습니다.'}</p>`; return; }
    el.innerHTML = `<div class="list">${evs.map(e => item(e, false)).join('')}</div>`;
  }
  function item(e, feed) {
    const c = catOf(e);
    return `<article class="item${newIds.has(e.id) ? ' new' : ''}">
      <div class="ib ${c}">${ico(ICON[c])}</div>
      <div class="b">
        <div class="t"><b class="${c}">${esc(e.title || CATS[c])}</b><small>${feed ? esc(`${parse(e.date).getMonth() + 1}/${parse(e.date).getDate()} (${WD[parse(e.date).getDay()]}) `) : ''}${esc(e.time || '')}${REPEATS[e.repeat] ? ' · ' + REPEATS[e.repeat] + ' 반복' : ''}</small></div>
        ${e.memo ? `<p class="m">${esc(e.memo)}</p>` : ''}
        ${e.en ? `<p class="en">${esc(e.en)}</p>` : ''}
        <div class="a">
          ${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${ico('ext')} 원문 보기</a>` : ''}
          ${isAuto(e) ? '' : `<button type="button" data-edit="${esc(e.id)}">${ico('edit')} 수정</button>${confirmDel === e.id ? `<button type="button" class="dan" data-del-yes="${esc(e.id)}">정말 삭제</button><button type="button" data-del-no="1">아니오</button>` : `<button type="button" data-del="${esc(e.id)}">${ico('trash')} 삭제</button>`}`}
        </div>
      </div></article>`;
  }
  function renderFeed() {
    const el = $('feed'); const posts = auto.filter(passes).sort((a, b) => b.ts - a.ts).slice(0, 30);
    if (!loaded) { el.innerHTML = '<p class="empty">불러오는 중…</p>'; return; }
    if (!posts.length) { el.innerHTML = '<p class="empty">표시할 글이 없습니다.</p>'; return; }
    el.innerHTML = posts.map((e, i) => item(e, true).replace('<article class="item', `<article style="--i:${Math.min(i, 8)}" class="item`)).join('');
  }
  function render(first) { renderHero(first); renderTypes(); renderCalendar(); renderDetail(); renderFeed(); renderNotif(); }

  // ----- notes form -----
  const f = { el: $('form'), id: $('f-id'), date: $('f-date'), time: $('f-time'), cat: $('f-cat'), repeat: $('f-repeat'), title: $('f-title'), memo: $('f-memo'), submit: $('f-submit'), formTitle: $('form-title') };
  function toast(msg) { const t = $('toast'); t.textContent = msg; if (msg) setTimeout(() => { if (t.textContent === msg) t.textContent = ''; }, 3500); }
  function showForm() { f.el.hidden = false; f.title.focus({ preventScroll: true }); f.el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' }); }
  function resetForm(keepDate) { f.id.value = ''; if (!keepDate) f.date.value = selected; f.time.value = ''; f.cat.value = 'etc'; f.repeat.value = 'none'; f.title.value = ''; f.memo.value = ''; f.submit.textContent = '추가'; f.formTitle.textContent = '내 기록 추가'; f.el.hidden = true; }
  function editNote(id) { const e = notes.find(x => x.id === id); if (!e) return; f.id.value = e.id; f.date.value = e.date; f.time.value = e.time || ''; f.cat.value = CATS[e.cat] ? e.cat : 'etc'; f.repeat.value = e.repeat || 'none'; f.title.value = e.title || ''; f.memo.value = e.memo || ''; f.submit.textContent = '저장'; f.formTitle.textContent = '내 기록 수정'; showForm(); }
  f.el.addEventListener('submit', ev => {
    ev.preventDefault();
    const data = { date: f.date.value, time: f.time.value, cat: f.cat.value, repeat: f.repeat.value, title: f.title.value.trim(), memo: f.memo.value.trim(), source: 'manual' };
    if (!data.date || !data.title) { toast('날짜와 제목은 꼭 적어야 합니다.'); return; }
    if (f.id.value) { const i = notes.findIndex(n => n.id === f.id.value); if (i >= 0) notes[i] = { ...data, id: f.id.value }; toast('수정했습니다.'); } else { notes.push({ ...data, id: 'n' + Date.now().toString(36) }); toast('추가했습니다.'); }
    ls.set('tibo-notes-v1', notes); selected = data.date; view = { y: parse(data.date).getFullYear(), m: parse(data.date).getMonth() }; resetForm(true); render(false);
  });
  $('f-cancel').addEventListener('click', () => resetForm(false));
  const openAdd = () => { resetForm(false); f.date.value = selected; showForm(); };
  $('add-btn').addEventListener('click', openAdd);
  $('nav-add').addEventListener('click', () => { document.querySelector('.cal').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); openAdd(); });

  // ----- interactions -----
  $('days').addEventListener('click', e => { const b = e.target.closest('[data-date]'); if (!b) return; selected = b.dataset.date; confirmDel = null; const d = parse(selected); if (d.getMonth() !== view.m || d.getFullYear() !== view.y) view = { y: d.getFullYear(), m: d.getMonth() }; if (!f.id.value) f.date.value = selected; renderCalendar(); renderDetail(); });
  $('detail').addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.edit) { editNote(t.dataset.edit); return; }
    if (t.dataset.del) { confirmDel = t.dataset.del; renderDetail(); return; }
    if (t.dataset.delNo) { confirmDel = null; renderDetail(); return; }
    if (t.dataset.delYes) { const id = t.dataset.delYes; confirmDel = null; notes = notes.filter(n => n.id !== id); ls.set('tibo-notes-v1', notes); if (f.id.value === id) resetForm(false); toast('삭제했습니다.'); render(false); }
  });
  $('prev').addEventListener('click', () => { view.m--; if (view.m < 0) { view.m = 11; view.y--; } renderCalendar(); });
  $('next').addEventListener('click', () => { view.m++; if (view.m > 11) { view.m = 0; view.y++; } renderCalendar(); });
  $('today-btn').addEventListener('click', () => { selected = todayStr; view = { y: new Date().getFullYear(), m: new Date().getMonth() }; if (!f.id.value) f.date.value = selected; renderCalendar(); renderDetail(); });
  const navBtns = { 'nav-home': 0, 'nav-cal': '.cal', 'nav-feed': '#feed-sec' };
  for (const [id, target] of Object.entries(navBtns)) $(id).addEventListener('click', () => { if (target === 0) window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); else document.querySelector(target).scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); setNav(id); });
  function setNav(id) { for (const k of Object.keys(navBtns)) $(k).classList.toggle('on', k === id); }
  // highlight nav by scroll position
  const io = new IntersectionObserver(entries => { for (const en of entries) if (en.isIntersecting) setNav(en.target.id === 'feed-sec' ? 'nav-feed' : en.target.classList.contains('cal') ? 'nav-cal' : 'nav-home'); }, { rootMargin: '-40% 0px -55% 0px' });
  io.observe(document.querySelector('.hero')); io.observe(document.querySelector('.cal')); io.observe($('feed-sec'));

  // ----- boot -----
  resetForm(false); render(true); load(false); schedule();
  if ('serviceWorker' in navigator && location.protocol === 'https:') { addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
})();
</script>
